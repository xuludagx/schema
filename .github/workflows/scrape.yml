name: Device Forum RSS - Saatlik Güncelleme

on:
  schedule:
    - cron: "0 * * * *"   # her saat başı (UTC)
  workflow_dispatch: {}   # Actions sekmesinden manuel de tetiklenebilir

permissions:
  contents: write

concurrency:
  group: device-forum-rss-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 55    # TIME_BUDGET_SECONDS (45dk) + kurulum/commit için tampon pay
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları yükle
        run: pip install -r scraper/requirements.txt

      - name: Scraper'ı çalıştır
        env:
          # Ayarlar > Secrets and variables > Actions > Variables kısmından
          # PAGES_BASE_URL değerini "https://kullaniciadi.github.io/repo-adi/"
          # şeklinde tanımlayın. (Not: değişken adı "GITHUB_" ile başlayamaz,
          # bu yüzden PAGES_BASE_URL kullanıyoruz; script içinde bunu
          # GITHUB_PAGES_BASE olarak veriyoruz.)
          GITHUB_PAGES_BASE: ${{ vars.PAGES_BASE_URL }}
          SITE_BASE: "https://device-forum.com"
          MAX_PAGES: "0"
          TIME_BUDGET_SECONDS: "2700"   # 45dk sonra tarama durur, rss.xml o ana kadarkiyle üretilir
          MAX_FEED_ITEMS: "500"
          REQUEST_DELAY: "0.4"
        run: python scraper/scraper.py

      - name: Değişiklikleri commit'le ve gönder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data rss.xml
          if git diff --cached --quiet; then
            echo "Değişiklik yok, commit atlanıyor."
          else
            git commit -m "Otomatik güncelleme: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
