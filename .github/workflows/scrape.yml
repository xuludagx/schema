name: Device Forum RSS - Saatlik Güncelleme

on:
  schedule:
    - cron: "0 * * * *"   # her saat başı (UTC)
  workflow_dispatch: {}   # Actions sekmesinden manuel de tetiklenebilir

permissions:
  contents: write

concurrency:
  group: device-forum-rss-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları yükle
        run: pip install -r scraper/requirements.txt

      - name: Scraper'ı çalıştır
        env:
          # Ayarlar > Secrets and variables > Actions > Variables kısmından
          # GITHUB_PAGES_BASE değerini "https://kullaniciadi.github.io/repo-adi/"
          # şeklinde tanımlayın.
          GITHUB_PAGES_BASE: ${{ vars.GITHUB_PAGES_BASE }}
          SITE_BASE: "https://device-forum.com"
          MAX_PAGES: "5000"
          MAX_FEED_ITEMS: "500"
          REQUEST_DELAY: "0.4"
        run: python scraper/scraper.py

      - name: Değişiklikleri commit'le ve gönder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data rss.xml
          if git diff --cached --quiet; then
            echo "Değişiklik yok, commit atlanıyor."
          else
            git commit -m "Otomatik güncelleme: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
